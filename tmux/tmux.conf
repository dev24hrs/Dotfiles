# ── Terminal  ──────────────────────────────────────────────────────

set -g  default-terminal "tmux-256color"
# terminal-features 是数组；先恢复默认再追加，保证 source-file 幂等
set -gu terminal-features
set -as terminal-features "*:RGB:usstyle:overline"

# 3.8 新增:detect(跟随终端上报)| terminal(用终端 ANSI 色,即 3.7 观感)| light | dark
set -s theme terminal

# ── General ───────────────────────────────────────────────────────

set -g  history-limit 50000
set -g  focus-events on
# 3.8 默认已 on；显式声明避免默认值变化
set -g  mouse on
setw -g aggressive-resize on
set -sg repeat-time 1000

set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on

# yazi config (allow-passthrough & update-environment)
set -gu update-environment
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000

# redraw status line / pane bar every 20 seconds
set -g status-interval 20

# off: 销毁当前 session 时客户端切到最近使用的其他 session,而不是退出 tmux(想直接退出用 on)。
set -g detach-on-destroy off

set -s  escape-time 10
set -s  extended-keys on
# for pi agent
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
# Ghostty 支持:sync(DECSET 2026 减少撕裂)/ OSC 8 超链接 / OSC 7 上报 cwd / OSC 9;4 进度条 / UTF-8
set -as terminal-features 'xterm*:sync:hyperlinks:osc7:progressbar:utf8'

# ── Clipboard  ───────────────────────────────────────────────────

set -s  set-clipboard on
set -g  allow-passthrough on
# 应用读剪贴板(OSC 52)时向终端要真实内容,而不是回 tmux buffer(默认 buffer;both 会额外存一份 buffer)
set -s  get-clipboard request

# ── Copy Mode (vi) ───────────────────────────────────────────────

set -g mode-keys vi
set -g status-keys vi
setw -g copy-mode-line-numbers default

bind v copy-mode

# 跨平台剪贴板:macOS 用 pbcopy,其他平台用 xclip
if-shell 'test "$(uname)" = "Darwin"' \
    'set -g @copy_command "pbcopy"' \
    'set -g @copy_command "xclip -selection clipboard"'
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@copy_command}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@copy_command}"

# ── Reload Config ───────────────────────────────────────────────

# reload configuration
bind , source-file ~/.config/tmux/tmux.conf \; display '~/.config/tmux/tmux.conf reloaded'

# ── Default Keybinds ────────────────────────────────────────────

# session
# prefix + s : show all sessions
# prefix + $ : rename current session
# prefix + d : detach session

# window
# prefix + w : show all windows
# prefix + c : new a window
# prefix + 0-9 : switch to window

# ── Custom Keys ────────────────────────────────────────────────

# session Keys
# prefix + q : kill current session
unbind q
bind-key -T prefix q kill-session

# prefix + n : new session
unbind n
bind n command-prompt -p "session name:" "new-session -s '%%'"

# window Keys
# prefix + r : rename current window
unbind r
bind r command-prompt -I "#{window_name}" "rename-window '%%'"

# prefix + S-Left & prefix + S-Right : switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

#  M is option on mac
# prefix + M-h & prefix + M-l : switch windows
bind -n M-h previous-window
bind -n M-l next-window

# pane Keys
# prefix + x : close current pane without confirm
bind-key -T prefix x kill-pane

# `prefix + - `& `prefix + =` to Split to panes
bind - split-window -v -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"

# prefix + C-h/j/k/l : switch panes
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# extended-keys 会把 Tab 编码成 CSI u 序列
# 部分 TUI (fish 命令补全等) 不识别,强制使用 Tab
bind -n Tab send-keys Tab

# ── Panes Config ────────────────────────────────────────────────

# 非活动(灰) & 活动(紫)
set -g pane-border-style        'fg=#808080'
set -g pane-active-border-style 'fg=#b294bb'
set -g pane-border-indicators   arrows

# 3.8: 滚动条浮在 pane 上，不压缩宽度
#set -g pane-scrollbars auto-hide
#set -g pane-scrollbars-timeout 500
#set -g pane-scrollbars-style 'fg=#b294bb,bg=default,width=1'

# ── Popup Config ────────────────────────────────────────────────

# 3.8 起 popup 默认用主题色(themedarkgrey)填充,这里重置为 default 以继承终端背景
set -g popup-style "default"
set -g popup-border-style "default"

# 使用 Prefix + g 打开 lazygit popup
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"

# 使用 Prefix + h 打开 hunk popup
bind h display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "hunk diff"

# 使用 Prefix + t 打开新窗口(支持ctrl+d 直接退出)
bind t display-popup -d "#{pane_current_path}" -w 60% -h 60%  -E "fish"

# 使用 Prefix + w 打开 worktrees 分支选择器(fzf)
bind w display-popup -d "#{pane_current_path}" -w 40% -h 40% -E "$HOME/.config/tmux/scripts/worktrees.sh"

# 使用 Prefix + y 切换 session
bind y display-popup -w 40% -h 40% -E "tmux list-sessions -F '#{?#{session_attached},#{session_name} (current),#{session_name}}' | fzf --reverse --no-border --prompt=\"Sessions> \" --preview-window hidden | sed -E 's/ \(current\)//' | xargs tmux switch-client -t"

# ── UI style ─────────────────────────────────────────────────────

set -g @bg  "default"
set -g @red "#fb4934"

set -g message-style 'bg=default,fg=default,fill=terminal'
set -g message-command-style 'bg=default,fg=default,fill=terminal'

set -g tree-mode-selection-style 'bg=#3c3836,fg=#{@red}'
set -g tree-mode-border-style 'bg=default,fg=default'
# set -g tree-mode-preview-style

# ── Status Bar ───────────────────────────────────────────────────

set-option -g status-justify centre
set-option -g status-style "bg=#{@bg}"
set-option -g status-left "#[bg=#{@bg},bold] [ #S ] "
set-option -g status-left-length 50
set-option -g status-right "#[bold]%Y-%m-%d %H:%M "
set-option -g status-right-length 50

set-option -g window-status-format "#[bold] #I:#W "
set-option -g window-status-current-format "#[bold] #I:#W "
set-option -g window-status-current-style "bg=#{@bg},fg=#{@red}"
set-option -g window-status-separator ""
set-option -g window-status-activity-style none

# ── Plugins ──────────────────────────────────────────────────────
# prefix + I : Installs new plugins
# prefix + U : updates plugin
# prefix + option + u : remove/uninstall plugins

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
