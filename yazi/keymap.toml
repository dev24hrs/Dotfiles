[mgr]
keymap = [
  { on = "<Esc>", run = "escape", desc = "Exit visual mode / clear selection / cancel search" },
  { on = "q", run = "quit --no-cwd-file", desc = "Quit" },

  # Goto
  { on = ["g", "h"], run = "cd ~", desc = "Home directory" },
  { on = ["g", "c"], run = "cd ~/.config", desc = "Go to ~/.config" },
  { on = ["g", "d"], run = "cd ~/Documents", desc = "Go to ~/Documents" },

  # vim-like navigation
  { on = "k", run = "arrow prev", desc = "Previous file" },
  { on = "j", run = "arrow next", desc = "Next file" },
  { on = "h", run = "leave", desc = "Go to parent directory" },
  { on = "l", run = "plugin smart-enter", desc = "Enter directory / smart open file" },

  { on = "<Up>", run = "arrow prev", desc = "Previous file" },
  { on = "<Down>", run = "arrow next", desc = "Next file" },
  { on = "<Left>", run = "leave", desc = "Go to parent directory" },
  { on = "<Right>", run = "enter", desc = "Enter directory" },

  { on = ["g", "g"], run = "arrow top", desc = "Top" },
  { on = "G", run = "arrow bot", desc = "Bottom" },

  # Selection
  { on = "<Space>", run = ["toggle", "arrow 1"], desc = "Toggle current selection" },
  { on = "<C-a>", run = "toggle_all --state=on", desc = "Select all files" },
  { on = "<C-r>", run = "toggle_all", desc = "Invert selection" },

  # Visual mode
  { on = "v", run = "visual_mode", desc = "Visual mode (select)" },
  { on = "V", run = "visual_mode --unset", desc = "Visual mode (unset)" },

  # Operation
  { on = "o", run = "open", desc = "Open selected file" },
  { on = "<Enter>", run = "open", desc = "Open selected file" },
  { on = "y", run = "yank", desc = "Copy selected files" },
  { on = "x", run = "yank --cut", desc = "Cut selected files" },
  { on = "p", run = "plugin smart-paste", desc = "Paste" },
  { on = "P", run = "paste --force", desc = "Paste (overwrite)" },
  { on = "Y", run = "unyank", desc = "Cancel cut/copy state" },
  { on = "X", run = "unyank", desc = "Cancel cut/copy state" },
  { on = "d", run = "remove", desc = "Move to trash" },
  { on = "a", run = "create", desc = "Create file (trailing / for directory)" },
  { on = "r", run = "rename --cursor=before_ext", desc = "Rename" },
  { on = ".", run = "hidden toggle", desc = "Toggle hidden files" },
  { on = "s", run = "search --via=fd", desc = "Search by filename (fd)" },
  { on = "<C-s>", run = "escape --search", desc = "Cancel current search" },
  { on = "f", run = "plugin fzf", desc = "Jump to file/directory (fzf)" },
  { on = "z", run = "plugin zoxide", desc = "Jump to directory (zoxide)" },

  # Copy
  { on = ["c", "c"], run = "copy path", desc = "Copy file path" },
  { on = ["c", "d"], run = "copy dirname", desc = "Copy parent directory path" },
  { on = ["c", "f"], run = "copy filename", desc = "Copy filename" },
  { on = ["c", "n"], run = "copy name_without_ext", desc = "Copy filename (without extension)" },

  # Filter
  { on = "/", run = "filter --smart", desc = "Filter files" },

  # Tabs
  { on = ["t", "t"], run = "tab_create --current", desc = "New tab in current directory" },
  { on = ["t", "r"], run = "tab_rename --interactive", desc = "Rename current tab" },

  { on = "1", run = "tab_switch 0", desc = "Switch to tab 1" },
  { on = "2", run = "tab_switch 1", desc = "Switch to tab 2" },
  { on = "3", run = "tab_switch 2", desc = "Switch to tab 3" },
  { on = "4", run = "tab_switch 3", desc = "Switch to tab 4" },
  { on = "5", run = "tab_switch 4", desc = "Switch to tab 5" },
  { on = "6", run = "tab_switch 5", desc = "Switch to tab 6" },

  { on = "[", run = "tab_switch -1 --relative", desc = "Previous tab" },
  { on = "]", run = "tab_switch 1 --relative", desc = "Next tab" },

  # Spotting
  { on = "<Tab>", run = "spot", desc = "Spot hovered file" },

  # Help
  { on = "~", run = "help", desc = "Open help" },
]

[spot]
keymap = [
  { on = "<Esc>", run = "close", desc = "Close spot" },
  { on = "<Tab>", run = "close", desc = "Close spot" },
]

[pick]
keymap = [
  { on = "<Esc>", run = "close", desc = "Cancel selection" },
  { on = "<Enter>", run = "close --submit", desc = "Confirm selection" },
  # Help
  { on = "~", run = "help", desc = "Open help" },
]

[help]
keymap = [
  { on = "<Esc>", run = "escape", desc = "Clear filter or close help" },
  { on = "<C-c>", run = "close", desc = "Close help" },

  # Navigation
  { on = "k", run = "arrow prev", desc = "Previous line" },
  { on = "j", run = "arrow next", desc = "Next line" },

  { on = "<Up>", run = "arrow prev", desc = "Previous line" },
  { on = "<Down>", run = "arrow next", desc = "Next line" },

  # Filtering
  { on = "f", run = "filter", desc = "Filter help items" },
]
